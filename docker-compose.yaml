# Local infrastructure for development. Start with: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox # local dev only
      POSTGRES_DB: inbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
