name: api

on:
  push:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
          POSTGRES_DB: inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://inbox:inbox@localhost:5432/inbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Migrations apply cleanly, and match the models (fails if someone forgot a migration).
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
